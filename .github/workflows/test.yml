name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Synthetic fixtures regenerate byte for byte
        run: |
          python generate_custodian.py "$RUNNER_TEMP/custodian"
          diff -r "$RUNNER_TEMP/custodian" fixtures/custodian
